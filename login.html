<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxera - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: #fff;
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
  }
  .login-box h1 { font-size: 22px; margin-bottom: 6px; color: #1a1a2e; }
  .login-box p.subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 18px; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #4f46e5; }
  button {
    width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: #4338ca; }
  button:disabled { background: #a5a5a5; cursor: not-allowed; }
  .error { color: #dc2626; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="login-box">
    <h1>Voxera</h1>
    <p class="subtitle">Sign in to continue</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Sign In</button>
      <p class="error" id="errorMsg">Invalid username or password.</p>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        // Store username so save-transcript.js can tag transcripts correctly
        localStorage.setItem('currentUser', username);
        // Store expiry so session-timer.js can show a countdown before it runs out
        if (data.expiresAt) {
          localStorage.setItem('voxera_session_expires', String(data.expiresAt));
        }
        window.location.href = '/voice_chat.html';
      } else {
        const data = await res.json().catch(() => ({}));
        errorMsg.textContent = data.error || 'Invalid username or password.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    } catch (err) {
      errorMsg.textContent = 'Something went wrong. Please try again.';
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
